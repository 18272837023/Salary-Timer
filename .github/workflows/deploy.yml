name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & Build
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm run test:geo
          npm run test:legal
          npm run test:agentic
        env:
          NEXT_PUBLIC_SITE_URL: https://salarytimer.work

      # `out/*` puts files at <target>/out/... unless the leading component is
      # stripped. Nginx serves <target> as its root, so without this the upload
      # lands one directory too deep and the live site keeps serving the old
      # build while the job still reports success.
      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: "out/*,scripts/apply-nginx-seo.py"
          target: "/var/www/salarytimer/"
          strip_components: 1
          overwrite: true

      - name: Fix permissions & reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            set -e
            # Clean up the nested directory left behind by the old deploy path.
            if [ -d /var/www/salarytimer/out ]; then
              sudo rm -rf /var/www/salarytimer/out
            fi
            # `scp out/*` never matches dot-directories, so a committed
            # public/.well-known/ would exist locally but never go live. Mirror
            # the single ARD source instead: consumers that only probe the
            # well-known path still get a real JSON file rather than the SPA
            # fallback's index.html (which Lighthouse reports as invalid JSON).
            sudo mkdir -p /var/www/salarytimer/.well-known
            sudo cp /var/www/salarytimer/ard.json /var/www/salarytimer/.well-known/ard.json
            sudo find /var/www/salarytimer -type d -exec chmod 755 {} \;
            sudo find /var/www/salarytimer -type f -exec chmod 644 {} \;
            sudo python3 /var/www/salarytimer/apply-nginx-seo.py
            sudo rm /var/www/salarytimer/apply-nginx-seo.py

      # A green deploy is not proof the site changed. Assert the live bundle
      # actually carries the current default so a silent stale deploy fails loudly.
      - name: Verify live bundle
        run: |
          set -euo pipefail
          html=$(curl -fsS "https://salarytimer.work/?cb=${GITHUB_SHA}")
          found=0
          for path in $(printf '%s' "$html" | grep -oE '/_next/static/chunks/[^"]+\.js' | sort -u); do
            body=$(curl -fsS "https://salarytimer.work${path}") || continue
            if printf '%s' "$body" | grep 'salarytimer\.site\.v2' > /dev/null; then
              found=1
              if printf '%s' "$body" | grep 'overtime:!0,otMult' > /dev/null; then
                echo "::error::Deployed bundle still defaults overtime to true ($path)"
                exit 1
              fi
              if ! printf '%s' "$body" | grep 'onboarded:!1,v:3' > /dev/null; then
                echo "::error::Deployed bundle is missing the v3 settings marker ($path)"
                exit 1
              fi
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::Could not locate the settings chunk on the live site"
            exit 1
          fi
          if ! printf '%s' "$html" | grep 'googletagmanager\.com/gtag/js?id=G-8T8JLTRSX9' > /dev/null; then
            echo "::error::GA4 tag is missing from the live HTML"
            exit 1
          fi
          if ! printf '%s' "$html" | grep 'rel="ard"' > /dev/null; then
            echo "::error::ARD manifest link is missing from the live HTML"
            exit 1
          fi
          # Assert discovery file content as well as the HTTP status.
          llms=$(curl -fsS "https://salarytimer.work/llms.txt?cb=${GITHUB_SHA}")
          if ! printf '%s' "$llms" | grep '^# Salary Timer' > /dev/null; then
            echo "::error::Live /llms.txt is missing or is the SPA fallback HTML"
            exit 1
          fi
          if ! printf '%s' "$llms" | grep '\[.*\](https://salarytimer\.work/' > /dev/null; then
            echo "::error::Live /llms.txt has no Markdown links"
            exit 1
          fi
          ard=$(curl -fsS "https://salarytimer.work/ard.json?cb=${GITHUB_SHA}")
          if ! printf '%s' "$ard" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!Array.isArray(j.entries)||!j.entries.length)process.exit(1);for(const e of j.entries){if(!e.identifier||!e.displayName||!e.type||!e.url)process.exit(1)}})'; then
            echo "::error::Live /ard.json is missing, invalid JSON, or incomplete"
            exit 1
          fi
          wellknown=$(curl -fsS "https://salarytimer.work/.well-known/ard.json?cb=${GITHUB_SHA}")
          if [ "$ard" != "$wellknown" ]; then
            echo "::error::/.well-known/ard.json does not match /ard.json"
            exit 1
          fi
          zh_html=$(curl -fsS "https://salarytimer.work/zh/?cb=${GITHUB_SHA}")
          if ! printf '%s' "$zh_html" | grep '<html[^>]*lang="zh-CN"' > /dev/null; then
            echo "::error::Chinese HTML has the wrong language before JavaScript"
            exit 1
          fi
          missing_status=$(curl -sS -o /dev/null -w '%{http_code}' "https://salarytimer.work/__missing_${GITHUB_SHA}/")
          if [ "$missing_status" != "404" ]; then
            echo "::error::Unknown route returned ${missing_status}; apply the repository nginx.conf routing rules"
            exit 1
          fi
          www_target=$(curl -sS -o /dev/null -w '%{redirect_url}' "https://www.salarytimer.work/?cb=${GITHUB_SHA}")
          if [ "$www_target" != "https://salarytimer.work/?cb=${GITHUB_SHA}" ]; then
            echo "::error::www hostname must redirect to the canonical hostname"
            exit 1
          fi
          echo "Live bundle OK: settings v3, GA4, ARD manifest, well-known mirror and llms.txt."
