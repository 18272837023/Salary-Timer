server {
    listen 80;
    server_name salarytimer.work www.salarytimer.work;
    
    # Redirect HTTP to HTTPS
    return 301 https://salarytimer.work$request_uri;
}

server {
    listen 443 ssl http2;
    server_name salarytimer.work www.salarytimer.work;

    # Consolidate the alternate hostname, preserving the path and query.
    if ($host = www.salarytimer.work) {
        return 301 https://salarytimer.work$request_uri;
    }

    root /var/www/salarytimer;
    index index.html;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/salarytimer.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salarytimer.work/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML files - no cache for SEO freshness
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Static Next.js export: unknown URLs must not return the homepage with 200.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Explicit trailing slash support for directories
    location ~ ^/(.+)/$ {
        try_files $uri/index.html =404;
    }
}
